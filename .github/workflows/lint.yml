name: Lint

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install pyflakes

      - name: Syntax check
        run: python -c "import py_compile; py_compile.compile('lattice_keeper.py', doraise=True)"

      - name: Pyflakes lint
        run: python -m pyflakes lattice_keeper.py
